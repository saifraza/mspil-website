<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS API Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        .info { background: #d1ecf1; }
        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CMS API Test</h1>
        
        <div class="test-section">
            <h2>Test CMS Endpoints</h2>
            <button onclick="testAllEndpoints()">Run All Tests</button>
        </div>

        <div id="results"></div>
    </div>

    <script>
        const endpoints = [
            {
                name: 'Local CMS',
                url: 'http://localhost:3002/api/content',
                expected: 'Should work when CMS is running locally'
            },
            {
                name: 'Production CMS (Railway)',
                url: 'https://mspil-mcp-production.up.railway.app/api/content',
                expected: 'Should work if production CMS is running'
            }
        ];

        async function testEndpoint(endpoint) {
            const resultDiv = document.createElement('div');
            resultDiv.className = 'test-section info';
            resultDiv.innerHTML = `<h3>Testing: ${endpoint.name}</h3><p>URL: ${endpoint.url}</p>`;
            
            try {
                console.log(`Testing ${endpoint.name}...`);
                const response = await fetch(endpoint.url, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    mode: 'cors'
                });

                const responseInfo = {
                    status: response.status,
                    statusText: response.statusText,
                    headers: {
                        'content-type': response.headers.get('content-type'),
                        'access-control-allow-origin': response.headers.get('access-control-allow-origin'),
                        'access-control-allow-credentials': response.headers.get('access-control-allow-credentials')
                    }
                };

                if (response.ok) {
                    const data = await response.json();
                    const categories = {};
                    data.forEach(item => {
                        categories[item.category] = (categories[item.category] || 0) + 1;
                    });

                    const leadershipItems = data.filter(item => 
                        item.category.includes('leadership') || 
                        item.category.includes('raza')
                    );

                    resultDiv.className = 'test-section success';
                    resultDiv.innerHTML += `
                        <p><strong>✅ SUCCESS</strong></p>
                        <p>Total items: ${data.length}</p>
                        <p>Leadership items: ${leadershipItems.length}</p>
                        <details>
                            <summary>Categories</summary>
                            <pre>${JSON.stringify(categories, null, 2)}</pre>
                        </details>
                        <details>
                            <summary>Leadership Items</summary>
                            <pre>${JSON.stringify(leadershipItems, null, 2)}</pre>
                        </details>
                        <details>
                            <summary>Response Headers</summary>
                            <pre>${JSON.stringify(responseInfo, null, 2)}</pre>
                        </details>
                    `;
                } else {
                    const errorText = await response.text();
                    resultDiv.className = 'test-section error';
                    resultDiv.innerHTML += `
                        <p><strong>❌ HTTP ${response.status}</strong></p>
                        <p>${response.statusText}</p>
                        <details>
                            <summary>Error Details</summary>
                            <pre>${errorText || 'No error message'}</pre>
                        </details>
                        <details>
                            <summary>Response Headers</summary>
                            <pre>${JSON.stringify(responseInfo, null, 2)}</pre>
                        </details>
                    `;
                }
            } catch (error) {
                resultDiv.className = 'test-section error';
                resultDiv.innerHTML += `
                    <p><strong>❌ Network Error</strong></p>
                    <p>${error.message}</p>
                    <details>
                        <summary>Error Stack</summary>
                        <pre>${error.stack}</pre>
                    </details>
                `;
            }

            return resultDiv;
        }

        async function testAllEndpoints() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<h2>Test Results</h2>';

            for (const endpoint of endpoints) {
                const result = await testEndpoint(endpoint);
                resultsDiv.appendChild(result);
            }

            // Test current origin
            const originDiv = document.createElement('div');
            originDiv.className = 'test-section info';
            originDiv.innerHTML = `
                <h3>Current Browser Context</h3>
                <p>Origin: ${window.location.origin}</p>
                <p>Protocol: ${window.location.protocol}</p>
                <p>Host: ${window.location.host}</p>
                <p>User Agent: ${navigator.userAgent}</p>
            `;
            resultsDiv.appendChild(originDiv);
        }

        // Auto-run tests on load
        window.addEventListener('load', testAllEndpoints);
    </script>
</body>
</html>
