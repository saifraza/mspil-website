<!DOCTYPE html>
<html>
<head>
    <title>Test Railway API CORS</title>
</head>
<body>
    <h1>Testing Railway API CORS</h1>
    <div id="results"></div>
    
    <script>
        const resultsDiv = document.getElementById('results');
        
        async function testAPI() {
            try {
                resultsDiv.innerHTML += '<p>Testing API...</p>';
                
                const response = await fetch('https://automationservice-production-4565.up.railway.app/api/media/list?category=news-gallery');
                
                resultsDiv.innerHTML += `<p>Response status: ${response.status}</p>`;
                
                if (response.ok) {
                    const data = await response.json();
                    resultsDiv.innerHTML += `<p>Success! Found ${data.length} files</p>`;
                    resultsDiv.innerHTML += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                } else {
                    resultsDiv.innerHTML += `<p>Error: ${response.statusText}</p>`;
                }
            } catch (error) {
                resultsDiv.innerHTML += `<p>CORS Error: ${error.message}</p>`;
            }
        }
        
        testAPI();
    </script>
</body>
</html>
