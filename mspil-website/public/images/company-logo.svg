<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer gear ring -->
  <circle cx="200" cy="200" r="190" fill="#888888" stroke="none"/>
  <circle cx="200" cy="200" r="170" fill="white" stroke="none"/>
  
  <!-- Gear teeth -->
  <g fill="#888888">
    <rect x="195" y="10" width="10" height="20"/>
    <rect x="245" y="18" width="10" height="20" transform="rotate(30 200 200)"/>
    <rect x="285" y="40" width="10" height="20" transform="rotate(60 200 200)"/>
    <rect x="315" y="75" width="10" height="20" transform="rotate(90 200 200)"/>
    <rect x="335" y="115" width="10" height="20" transform="rotate(120 200 200)"/>
    <rect x="345" y="160" width="10" height="20" transform="rotate(150 200 200)"/>
    <rect x="345" y="205" width="10" height="20" transform="rotate(180 200 200)"/>
    <rect x="335" y="250" width="10" height="20" transform="rotate(210 200 200)"/>
    <rect x="315" y="290" width="10" height="20" transform="rotate(240 200 200)"/>
    <rect x="285" y="325" width="10" height="20" transform="rotate(270 200 200)"/>
    <rect x="245" y="347" width="10" height="20" transform="rotate(300 200 200)"/>
    <rect x="195" y="355" width="10" height="20" transform="rotate(330 200 200)"/>
  </g>
  
  <!-- Inner green circle -->
  <circle cx="200" cy="200" r="120" fill="#A4D65E"/>
  
  <!-- Sugarcane stalks -->
  <g fill="#4A7C2A">
    <!-- Left stalk -->
    <path d="M150 120 Q155 140 150 160 Q145 180 150 200 Q155 220 150 240 Q145 260 150 280" stroke="#4A7C2A" stroke-width="8" fill="none"/>
    
    <!-- Middle stalk -->
    <path d="M200 100 Q205 120 200 140 Q195 160 200 180 Q205 200 200 220 Q195 240 200 260 Q205 280 200 300" stroke="#4A7C2A" stroke-width="10" fill="none"/>
    
    <!-- Right stalk -->
    <path d="M250 120 Q245 140 250 160 Q255 180 250 200 Q245 220 250 240 Q255 260 250 280" stroke="#4A7C2A" stroke-width="8" fill="none"/>
    
    <!-- Leaves -->
    <path d="M130 130 Q120 125 115 135 Q125 140 135 135" fill="#4A7C2A"/>
    <path d="M140 150 Q130 145 125 155 Q135 160 145 155" fill="#4A7C2A"/>
    <path d="M270 130 Q280 125 285 135 Q275 140 265 135" fill="#4A7C2A"/>
    <path d="M260 150 Q270 145 275 155 Q265 160 255 155" fill="#4A7C2A"/>
    <path d="M180 110 Q170 105 165 115 Q175 120 185 115" fill="#4A7C2A"/>
    <path d="M220 110 Q230 105 235 115 Q225 120 215 115" fill="#4A7C2A"/>
  </g>
  
  <!-- Wind lines -->
  <g stroke="white" stroke-width="3" fill="none">
    <path d="M260 180 L300 170"/>
    <path d="M260 200 L295 195"/>
    <path d="M260 220 L290 220"/>
  </g>
  
  <!-- Ethanol drops -->
  <g fill="#2E7D32">
    <ellipse cx="200" cy="300" rx="4" ry="8"/>
    <ellipse cx="210" cy="315" rx="4" ry="8"/>
    <ellipse cx="190" cy="315" rx="4" ry="8"/>
    <ellipse cx="200" cy="330" rx="4" ry="8"/>
    <ellipse cx="210" cy="345" rx="4" ry="8"/>
    <ellipse cx="190" cy="345" rx="4" ry="8"/>
  </g>
  
  <!-- Company text -->
  <defs>
    <path id="circle-text" d="M 200,200 m -160,0 a 160,160 0 1,1 320,0 a 160,160 0 1,1 -320,0"/>
  </defs>
  
  <text font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1E3A8A">
    <textPath href="#circle-text" startOffset="0%">
      MAHAKAUSHAL SUGAR AND POWER INDUSTRIES LTD.
    </textPath>
  </text>
</svg>